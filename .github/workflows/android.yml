# CI for Wolf Paint DZ. A development tool, not part of the app: the installed app has no network code.
#
# Job graph:
#   bootstrap  creates (or reuses the committed) Cargo.lock and Gradle wrapper and uploads them as
#              the artifact `bootstrap-files` BEFORE anything can fail. rust/android never generate
#              these files themselves: they download exactly this artifact.
#   rust       static checks (strict), host tests, Android target check
#   android    unit tests + debug APK through ./gradlew, APK checks, then an unsigned R8 release build with
#              permission / 16 KB alignment / JNI export / R8 keep checks (opt-in emulator tests at the end)
#   supply-chain  cargo-deny (bans, licenses, sources) with the policy in deny.toml; advisories informational
#
# Third-party actions are pinned to full commit SHAs (`# vX.Y.Z` names the release; scripts/verify_action_pins.py
# checks the pins and, in the bootstrap job, that every SHA really is that release). actions/* (owned by GitHub)
# use release tags. See docs/CI.md.
#
# Versions below must match rust-toolchain.toml, app/build.gradle.kts, gradle-wrapper.properties and
# docs/VERSIONS.md; scripts/check_project_consistency.py enforces it.
name: Wolf Paint DZ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_instrumented:
        description: "Also run instrumented tests on an x86_64 emulator (slow)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_NDK_VERSION: "4.1.2"
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS_VERSION: "36.0.0"
  PLATFORM: "android-37.0"
  GRADLE_VERSION: "9.5.0"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  bootstrap:
    name: Bootstrap (Cargo.lock + Gradle wrapper)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Third-party action pins match their release tags
        run: python3 scripts/verify_action_pins.py --online

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            -c clippy -c rustfmt \
            -t aarch64-linux-android -t x86_64-linux-android -t armv7-linux-androideabi

      - name: Cargo.lock (reuse committed, else generate once)
        run: |
          if [ -f Cargo.lock ]; then
            echo "Using the committed Cargo.lock"
          else
            echo "::warning::Cargo.lock is not committed: generated here. Commit it from the 'bootstrap-files' artifact."
            cargo generate-lockfile
          fi
          test -s Cargo.lock

      # Gradle is installed here ONLY so that scripts/generate-wrapper.sh has a `gradle` to run.
      # cache-provider: basic = the MIT-licensed cache; the v6 default is a proprietary component with separate terms.
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Gradle wrapper (reuse committed, else generate with the two-stage script)
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Using the committed Gradle wrapper"
          else
            echo "::warning::Gradle wrapper is not committed: generated here. Commit it from the 'bootstrap-files' artifact."
            ./scripts/generate-wrapper.sh
          fi
          chmod +x gradlew

      # Uploaded before any verification step, and even if a later step fails.
      - name: Upload bootstrap files
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-files
          path: |
            Cargo.lock
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
          if-no-files-found: warn

      - name: Wrapper really runs Gradle ${{ env.GRADLE_VERSION }}
        run: |
          ./gradlew --version | tee gradle-version.txt
          grep -Eq "^Gradle ${GRADLE_VERSION//./\\.}[[:space:]]*$" gradle-version.txt

      - name: Strict project checks
        run: python3 scripts/check_project_consistency.py --strict

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Bootstrap files"
            echo "Download the artifact **bootstrap-files** and commit its contents to the repository root:"
            echo '```'
            echo "git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar Cargo.lock"
            echo "git update-index --chmod=+x gradlew"
            echo '```'
            echo "Artifacts do not keep the executable bit; \`chmod +x gradlew\` after unpacking."
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust (host tests + Android target check)
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Get the bootstrap files (the single Cargo.lock and wrapper)
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-files
          path: .

      - name: Check downloaded files and run strict static checks
        run: |
          chmod +x gradlew
          test -s Cargo.lock && test -f gradle/wrapper/gradle-wrapper.jar
          python3 scripts/check_jni_symbols.py
          python3 scripts/check_project_consistency.py --strict
          python3 scripts/check_lock_policy.py
          python3 -m unittest discover -s scripts/tests
          scripts/test_verify_apk_permissions.sh

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            -c clippy -c rustfmt \
            -t aarch64-linux-android -t x86_64-linux-android -t armv7-linux-androideabi
          rustc --version
          cargo --version

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy (report only)
        run: cargo clippy --workspace --all-targets --locked

      - name: cargo check for Android targets
        run: |
          for target in aarch64-linux-android x86_64-linux-android armv7-linux-androideabi; do
            cargo check --package core-ffi --target "$target" --locked
          done

  android:
    name: Wolf Paint DZ debug APK
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Get the bootstrap files (the single Cargo.lock and wrapper)
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-files
          path: .

      - name: Check downloaded files
        run: |
          chmod +x gradlew
          test -s Cargo.lock && test -f gradle/wrapper/gradle-wrapper.jar
          python3 scripts/check_project_consistency.py --strict

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            -c clippy -c rustfmt \
            -t aarch64-linux-android -t x86_64-linux-android -t armv7-linux-androideabi

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ env.CARGO_NDK_VERSION }}-${{ runner.os }}

      - name: Install cargo-ndk ${{ env.CARGO_NDK_VERSION }}
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Android SDK packages (installed and verified)
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          set -o pipefail
          echo "Platform packages offered by sdkmanager:"
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[67]" || true
          PACKAGES=("platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}")
          "$SDKMANAGER" "${PACKAGES[@]}" 2>&1 | tee sdkmanager-install.log
          # sdkmanager exits with 0 even for an unknown package ("Warning: Failed to find package ..."),
          # so the log and the installed list are checked explicitly.
          if grep -q "Failed to find package" sdkmanager-install.log; then
            echo "::error::sdkmanager could not find a requested package (see log above)"
            exit 1
          fi
          INSTALLED="$("$SDKMANAGER" --list_installed 2>/dev/null)"
          for pkg in "${PACKAGES[@]}"; do
            printf '%s\n' "$INSTALLED" | grep -qF "$pkg" || { echo "::error::package '$pkg' is not installed"; exit 1; }
          done
          test -d "${ANDROID_HOME}/platforms/${PLATFORM}" \
            || { echo "::error::${ANDROID_HOME}/platforms/${PLATFORM} does not exist"; exit 1; }
          echo "SDK packages verified: ${PACKAGES[*]}"

      # No gradle-version here: the build must run through the generated wrapper, not a Gradle
      # installed by the action or preinstalled on the runner image. This step only adds caching
      # (basic = MIT-licensed provider, see the bootstrap job).
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic

      - name: Gradle wrapper version
        run: |
          ./gradlew --version | tee gradle-version.txt
          grep -Eq "^Gradle ${GRADLE_VERSION//./\\.}[[:space:]]*$" gradle-version.txt

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Proof that the wrapper distribution was used
        run: |
          test -d "${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/gradle-${GRADLE_VERSION}-bin"

      - name: Verify APK contents and permissions
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep "librpx_core.so"
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2" scripts/verify-apk-permissions.sh "$APK"
          python3 scripts/check_apk_native.py "$APK"

      # Gradle's output name stays app-debug.apk; the delivered file gets the product name.
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk wolf-paint-dz-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: wolf-paint-dz-debug-apk
          path: wolf-paint-dz-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # ---- Release variant: unsigned, R8 on (signing is a later stage). Runs after the debug artifacts are
      # uploaded, so a failure here never hides the debug APK.
      - name: Release build (unsigned, R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Release APK, offline rule (no INTERNET, read by aapt2)
        run: |
          AAPT2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2" \
            scripts/verify-apk-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Release APK, 16 KB zip alignment (zipalign)
        run: |
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign" -c -P 16 -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Release APK, native library (ELF 16 KB, stored, JNI exports)
        run: python3 scripts/check_apk_native.py app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Release build, R8 keeps the JNI classes and methods
        run: python3 scripts/check_r8_keep.py app/build/outputs/mapping/release

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: r8-mapping-release
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Enable KVM for the emulator
        if: ${{ inputs.run_instrumented }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator, x86_64)
        if: ${{ inputs.run_instrumented }}
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.run_instrumented }}
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  supply-chain:
    name: Supply chain (cargo-deny)
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Get the bootstrap files (the single Cargo.lock and wrapper)
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-files
          path: .

      - name: Offline lock-file policy (banned crates, sources)
        run: |
          test -s Cargo.lock
          python3 scripts/check_lock_policy.py

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      # The lock file must already be in sync with the manifests; cargo-deny must not decide that for us.
      - name: Cargo.lock is in sync with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo deny check bans licenses sources
        run: cargo deny check bans licenses sources

      # Informational only: the RustSec database changes daily and its format can outpace the pinned
      # cargo-deny, so a red advisory check must not block unrelated work. Read the output.
      - name: cargo deny check advisories (informational)
        continue-on-error: true
        run: cargo deny check advisories
