org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official

# ABIs that are built by cargo-ndk AND packaged into the APK (comma separated).
#   arm64-v8a    physical devices (primary target)
#   x86_64       Android emulator on desktop
#   armeabi-v7a  32-bit devices; opt-in, re-evaluated once wgpu joins in stage 2
rpx.rustAbis=arm64-v8a,x86_64
