[workspace]
resolver = "3"
members = [
  "crates/core-model",
  "crates/core-raster",
  "crates/core-brush",
  "crates/core-history",
  "crates/core-render",
  "crates/core-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
core-model   = { path = "crates/core-model" }
core-raster  = { path = "crates/core-raster" }
core-brush   = { path = "crates/core-brush" }
core-history = { path = "crates/core-history" }
core-render  = { path = "crates/core-render" }
jni          = "0.21.1"
log          = "0.4"
android_logger = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
